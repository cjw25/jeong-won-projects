<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>
        다른 기기에 패스키 추가 | CJW's STORY
    </title>

    <link
            rel="stylesheet"
            href="/css/private.css"
    >

</head>


<body class="private-body">

<main class="private-shell">


    <header class="private-header">

        <a
                href="/private.html"
                class="back-link"
        >
            ← PRIVATE SPACE로 돌아가기
        </a>


        <p class="private-kicker">
            ADD ANOTHER DEVICE
        </p>


        <h1 class="private-title">
            📱 아이폰에 패스키 추가
        </h1>


        <p class="private-description">
            현재 로그인한 계정에 다른 기기의 패스키를
            추가하기 위한 1회용 코드를 생성합니다.
        </p>

    </header>


    <section class="panel">

        <h2>
            1회용 등록 코드
        </h2>


        <p class="help-text">
            코드는 5분 동안 한 번만 사용할 수 있습니다.
            아이폰에서는 Bluetooth가 필요하지 않습니다.
        </p>


        <div class="button-group">

            <button
                    id="createCodeButton"
                    type="button"
                    class="button primary"
            >
                아이폰 등록 코드 생성
            </button>

        </div>


        <div
                id="codeArea"
                hidden
        >

            <p class="help-text">
                아래 주소를 아이폰 Safari에서 여세요.
            </p>


            <p>

                <a
                        id="registerUrl"
                        href="/device-register.html"
                        class="back-link"
                >
                    https://pawdkey.vercel.app/device-register.html
                </a>

            </p>


            <div class="locked-box">

                <strong>
                    등록 코드
                </strong>


                <p
                        id="deviceCode"
                        style="
                            font-size: 2rem;
                            letter-spacing: 0.12em;
                            font-weight: 800;
                        "
                >
                    ---- ---- ----
                </p>

            </div>


            <p
                    id="expiresText"
                    class="help-text"
            ></p>

        </div>


        <p
                id="message"
                class="message"
                aria-live="polite"
        ></p>

    </section>

</main>


<script src="/js/device-link.js"></script>

</body>

</html>
