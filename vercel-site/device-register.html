<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
          name="viewport"
          content="width=device-width, initial-scale=1.0"
  >

  <title>
    iPhone 패스키 등록 | CJW's STORY
  </title>

  <link
          rel="stylesheet"
          href="/css/private.css"
  >


  <script
          src="https://unpkg.com/@simplewebauthn/browser@14.0.0/dist/bundle/index.umd.min.js"
  ></script>

</head>


<body class="private-body">

<main class="private-shell">


  <header class="private-header">

    <p class="private-kicker">
      IPHONE PASSKEY
    </p>


    <h1 class="private-title">
      📱 패스키 등록
    </h1>


    <p class="private-description">
      PC에서 생성한 1회용 코드를 입력한 뒤
      Face ID로 이 아이폰에 패스키를 저장합니다.
    </p>

  </header>


  <section class="panel">

    <div class="form-grid">


      <div class="field">

        <label for="deviceCode">
          1회용 코드
        </label>


        <input
                id="deviceCode"
                type="text"
                maxlength="14"
                placeholder="ABCD-EFGH-JKLM"
                autocomplete="off"
                autocapitalize="characters"
        >

      </div>


      <div class="field">

        <label for="passkeyName">
          패스키 이름
        </label>


        <input
                id="passkeyName"
                type="text"
                maxlength="100"
                value="iPhone 패스키"
                autocomplete="off"
        >

      </div>

    </div>


    <div class="button-group">

      <button
              id="registerButton"
              type="button"
              class="button primary"
      >
        Face ID로 패스키 등록
      </button>

    </div>


    <p
            id="message"
            class="message"
            aria-live="polite"
    ></p>

  </section>


  <section
          id="successPanel"
          class="panel"
          hidden
  >

    <p class="section-kicker">
      SUCCESS
    </p>


    <h2>
      패스키 등록 완료
    </h2>


    <p id="successText">
    </p>


    <p class="help-text">
      서버에는 공개키만 저장되었습니다.
      개인키는 이 아이폰의 패스키 저장소에 남습니다.
    </p>


    <a
            href="/private.html"
            class="button primary"
            style="
                    display: inline-block;
                    text-decoration: none;
                "
    >
      PRIVATE SPACE 열기
    </a>

  </section>

</main>


<script src="/js/device-register.js"></script>

</body>

</html>
