<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        5일 기록 설정 - Plan Do See Diary
    </title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>


<body>

<header class="page-header">

    <div>

        <span class="page-kicker">
            5 DAY EXPERIMENT
        </span>

        <h1>
            5일 기록 시작
        </h1>

        <p class="page-description">
            1일차 기록을 시작하기 전에 질문·지표·단위·계산 규칙을 고정합니다.
        </p>

    </div>


    <a class="header-link"
       th:href="@{/}">

        홈으로

    </a>

</header>


<section class="plan-detail-card">

    <form th:action="@{/five-day/setup}"
          th:object="${fiveDayExperimentForm}"
          method="post">


        <div>

            <label for="question">
                답하려는 질문
            </label>

            <textarea id="question"
                      th:field="*{question}">
            </textarea>

            <p th:errors="*{question}">
            </p>

        </div>


        <div>

            <label for="metricName">
                관찰 지표
            </label>

            <input id="metricName"
                   type="text"
                   th:field="*{metricName}">

            <p th:errors="*{metricName}">
            </p>

        </div>


        <div>

            <label for="unit">
                단위
            </label>

            <input id="unit"
                   type="text"
                   th:field="*{unit}">

            <p th:errors="*{unit}">
            </p>

        </div>


        <div>

            <label for="calculationRule">
                계산 규칙
            </label>

            <textarea id="calculationRule"
                      th:field="*{calculationRule}">
            </textarea>

            <p th:errors="*{calculationRule}">
            </p>

        </div>


        <div>

            <label for="originalPlanRule">
                최초 계획 규칙
            </label>

            <textarea id="originalPlanRule"
                      th:field="*{originalPlanRule}">
            </textarea>

            <p th:errors="*{originalPlanRule}">
            </p>

        </div>


        <hr>


        <h2>
            값 처리 규칙
        </h2>


        <div>

            <label for="missingValueRule">
                값이 빠졌을 때
            </label>

            <textarea id="missingValueRule"
                      th:field="*{missingValueRule}">
            </textarea>

        </div>


        <div>

            <label for="duplicateValueRule">
                값이 중복될 때
            </label>

            <textarea id="duplicateValueRule"
                      th:field="*{duplicateValueRule}">
            </textarea>

        </div>


        <div>

            <label for="outlierRule">
                값이 유난히 튈 때
            </label>

            <textarea id="outlierRule"
                      th:field="*{outlierRule}">
            </textarea>

        </div>


        <div>

            <label for="roundingRule">
                반올림 방법
            </label>

            <textarea id="roundingRule"
                      th:field="*{roundingRule}">
            </textarea>

        </div>


        <div>

            <label for="weekStart">
                주 시작 요일
            </label>

            <input id="weekStart"
                   type="text"
                   th:field="*{weekStart}">

        </div>


        <p th:if="${setupError}"
           th:text="${setupError}">
        </p>


        <button type="submit">
            이 규칙으로 시작
        </button>

    </form>

</section>

</body>

</html>
