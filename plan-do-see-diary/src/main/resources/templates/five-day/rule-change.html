<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>
    계획 규칙 변경 - Plan Do See Diary
  </title>

  <link rel="stylesheet"
        th:href="@{/css/style.css}">

</head>


<body>

<header class="page-header">

  <div>

        <span class="page-kicker">
            RULE CHANGE
        </span>

    <h1>
      계획 규칙 변경
    </h1>

    <p class="page-description">
      DAY 1과 DAY 2 기록 뒤, DAY 3 기록 전에 딱 한 번 변경합니다.
    </p>

  </div>

</header>


<section class="plan-detail-card">

  <div class="plan-detail-item">

        <span>
            변경 전 규칙
        </span>

    <strong th:text="${experiment.originalPlanRule}">
    </strong>

  </div>


  <h2>
    변경 기준이 되는 기록
  </h2>


  <div class="revision-grid">

    <article th:each="record, stat : ${records}">

            <span class="section-kicker">
                DAY
                <span th:text="${stat.index + 1}">
                    1
                </span>
            </span>

      <h3 th:text="${record.recordDate}">
      </h3>

      <p>
        <strong th:text="${record.metricValue}">
        </strong>

        <span th:text="${experiment.unit}">
                </span>
      </p>

    </article>

  </div>


  <form th:action="@{/five-day/rule-change}"
        th:object="${ruleChangeForm}"
        method="post">


    <div>

      <label for="changedPlanRule">
        변경 후 계획 규칙
      </label>

      <textarea id="changedPlanRule"
                th:field="*{changedPlanRule}">
            </textarea>

    </div>


    <div>

      <label for="reason">
        규칙을 바꾸는 이유
      </label>

      <textarea id="reason"
                th:field="*{reason}"
                placeholder="DAY 1·2를 사용해 보고 왜 이 규칙을 바꾸는지 적습니다.">
            </textarea>

    </div>


    <p th:if="${ruleChangeError}"
       th:text="${ruleChangeError}">
    </p>


    <button type="submit">
      규칙 한 번 변경하기
    </button>

  </form>

</section>

</body>

</html>
