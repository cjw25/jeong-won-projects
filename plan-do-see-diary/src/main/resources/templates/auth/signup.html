<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>회원가입 - Plan Do See Diary</title>

  <link rel="stylesheet"
        th:href="@{/css/style.css}">
</head>

<body>

<header class="page-header">

  <div>
        <span class="page-kicker">
            ACCOUNT
        </span>

    <h1>회원가입</h1>

    <p class="page-description">
      계정을 만들고 내 기록을 보호합니다.
    </p>
  </div>

</header>


<section class="plan-detail-card">

  <form th:action="@{/signup}"
        th:object="${signupForm}"
        method="post">

    <div>
      <label for="username">
        아이디
      </label>

      <input id="username"
             type="text"
             th:field="*{username}"
             autocomplete="username">

      <p th:if="${#fields.hasErrors('username')}"
         th:errors="*{username}">
      </p>
    </div>


    <div>
      <label for="password">
        비밀번호
      </label>

      <input id="password"
             type="password"
             name="password"
             autocomplete="new-password">

      <p th:if="${#fields.hasErrors('password')}"
         th:errors="*{password}">
      </p>
    </div>


    <div>
      <label for="passwordConfirm">
        비밀번호 확인
      </label>

      <input id="passwordConfirm"
             type="password"
             name="passwordConfirm"
             autocomplete="new-password">

      <p th:if="${#fields.hasErrors('passwordConfirm')}"
         th:errors="*{passwordConfirm}">
      </p>
    </div>


    <p th:if="${signupError}"
       th:text="${signupError}">
    </p>


    <button type="submit">
      계정 만들기
    </button>

  </form>


  <p>
    이미 계정이 있다면
    <a th:href="@{/login}">
      로그인
    </a>
  </p>

</section>

</body>
</html>
