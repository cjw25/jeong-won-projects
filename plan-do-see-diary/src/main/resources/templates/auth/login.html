<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>
    로그인 - Plan Do See Diary
  </title>

  <link rel="stylesheet"
        th:href="@{/css/style.css}">

</head>


<body>

<header class="page-header">

  <div>

        <span class="page-kicker">
            PLAN · DO · SEE
        </span>

    <h1>
      로그인
    </h1>

    <p class="page-description">
      내 기록은 로그인한 뒤에만 볼 수 있습니다.
    </p>

  </div>

</header>


<section class="plan-detail-card">

  <form th:action="@{/login}"
        method="post">


    <div>

      <label for="username">
        아이디
      </label>

      <input id="username"
             type="text"
             name="username"
             autocomplete="username"
             required>

    </div>


    <div>

      <label for="password">
        비밀번호
      </label>

      <input id="password"
             type="password"
             name="password"
             autocomplete="current-password"
             required>

    </div>


    <p th:if="${loginError}"
       th:text="${loginError}">
    </p>


    <p th:if="${logoutMessage}"
       th:text="${logoutMessage}">
    </p>


    <p th:if="${signupMessage}"
       th:text="${signupMessage}">
    </p>


    <p th:if="${passwordChangedMessage}"
       th:text="${passwordChangedMessage}">
    </p>


    <p th:if="${accountDeletedMessage}"
       th:text="${accountDeletedMessage}">
    </p>


    <button type="submit">
      로그인
    </button>

  </form>


  <p>
    아직 계정이 없다면

    <a th:href="@{/signup}">
      회원가입
    </a>
  </p>

</section>

</body>

</html>
