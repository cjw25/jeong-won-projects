<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>
    비밀번호 변경 - Plan Do See Diary
  </title>

  <link rel="stylesheet"
        th:href="@{/css/style.css}">

</head>


<body>

<header class="page-header">

  <div>

        <span class="page-kicker">
            ACCOUNT
        </span>

    <h1>
      비밀번호 변경
    </h1>

    <p class="page-description">
      비밀번호를 변경하면 현재 로그인 세션이 종료됩니다.
    </p>

  </div>


  <a class="header-link"
     th:href="@{/}">

    홈으로

  </a>

</header>


<section class="plan-detail-card">

  <form th:action="@{/account/password}"
        th:object="${passwordChangeForm}"
        method="post">


    <div>

      <label for="currentPassword">
        현재 비밀번호
      </label>

      <input id="currentPassword"
             type="password"
             name="currentPassword"
             autocomplete="current-password"
             required>

      <p th:if="${#fields.hasErrors('currentPassword')}"
         th:errors="*{currentPassword}">
      </p>

    </div>


    <div>

      <label for="newPassword">
        새 비밀번호
      </label>

      <input id="newPassword"
             type="password"
             name="newPassword"
             autocomplete="new-password"
             required>

      <p th:if="${#fields.hasErrors('newPassword')}"
         th:errors="*{newPassword}">
      </p>

    </div>


    <div>

      <label for="newPasswordConfirm">
        새 비밀번호 확인
      </label>

      <input id="newPasswordConfirm"
             type="password"
             name="newPasswordConfirm"
             autocomplete="new-password"
             required>

      <p th:if="${#fields.hasErrors('newPasswordConfirm')}"
         th:errors="*{newPasswordConfirm}">
      </p>

    </div>


    <p th:if="${passwordChangeError}"
       th:text="${passwordChangeError}">
    </p>


    <button type="submit">
      비밀번호 변경
    </button>

  </form>

</section>

</body>

</html>
